<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NovaMart</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="topbar">Sell on NovaMart · Help · Kaduna</div>
  <header class="head">
    <a class="logo" href="#">Nova<span>Mart</span></a>
    <form id="search">
      <input name="q" placeholder="Search products, brands and categories" />
      <button type="submit">Search</button>
    </form>
    <button class="cartbtn" id="openCart">Cart <b id="count">0</b></button>
  </header>
  <nav class="cats" id="cats"></nav>
  <section class="flash">
    <div>
      <strong>Flash deals</strong>
      <p>Official-store accessories. Order on WhatsApp.</p>
    </div>
    <span>Not Jumia — independent shop</span>
  </section>
  <main>
    <h2>Phones &amp; accessories</h2>
    <div class="grid" id="grid"></div>
  </main>
  <aside class="drawer" id="drawer">
    <h3>Cart</h3>
    <div id="cartList"></div>
    <p id="total"></p>
    <form id="order">
      <input name="buyer" required placeholder="Your name" />
      <input name="phone" required placeholder="WhatsApp number" />
      <input name="note" placeholder="Delivery note" />
      <button type="submit">Checkout on WhatsApp</button>
    </form>
    <button class="ghost" id="closeCart" type="button">Close</button>
  </aside>
  <footer>NovaMart · Victor Kumba · WhatsApp +234 903 411 5677</footer>
  <script src="app.js"></script>
</body>
</html>
