<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NovaMart — Demo shop</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="bar">
    <strong>NovaMart</strong>
    <span class="pill">DEMO STORE</span>
    <nav><a href="#shop">Shop</a><a href="#cart">Cart (<span id="count">0</span>)</a></nav>
  </header>
  <section class="hero">
    <p class="kicker">Portfolio demo</p>
    <h1>Everyday tech, shipped from Kaduna.</h1>
    <p>Fictional catalog. Checkout opens WhatsApp — no card data stored.</p>
  </section>
  <section id="shop" class="grid"></section>
  <section id="cart" class="cart">
    <h2>Cart</h2>
    <div id="cartList"></div>
    <p id="total"></p>
    <a id="wa" class="btn" href="#">Checkout on WhatsApp</a>
  </section>
  <footer>Demo only · Victor Kumba / Mr. Darknova</footer>
  <script src="app.js"></script>
</body>
</html>
